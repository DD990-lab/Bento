<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<style>
:root{
  --furoshiki:#16222B;
  --furoshiki-2:#1E2E38;
  --wappa:#C79A5E;
  --wappa-dark:#8E6636;
  --rice:#F6F2E7;
  --rice-line:#E4DDC9;
  --ink:#F3EFE4;
  --ink-dim:#93A2AA;
  --baran:#3E7A44;
  --line:rgba(243,239,228,.14);
  --cell:min(10.6vw, 42px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 80% at 50% 0%, var(--furoshiki-2), var(--furoshiki) 70%);
  color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  min-height:100vh;
  padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 20px);
  display:flex;flex-direction:column;align-items:center;
  font-feature-settings:"palt" 1;
}
.wrap{width:100%;max-width:420px}

header{display:flex;align-items:baseline;justify-content:space-between;padding:20px 2px 14px}
h1{
  margin:0;font-size:21px;font-weight:600;letter-spacing:.14em;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
.date{font-size:12px;color:var(--ink-dim);letter-spacing:.08em;font-variant-numeric:tabular-nums}

.badge{
  display:inline-flex;gap:8px;align-items:center;
  font-size:11px;letter-spacing:.1em;color:var(--ink-dim);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;margin:0 2px 14px;
}
.badge b{color:var(--wappa);font-weight:600}

/* 弁当箱 */
.box{
  position:relative;
  padding:11px;border-radius:6px;
  background:linear-gradient(160deg,var(--wappa),var(--wappa-dark));
  box-shadow:0 18px 34px -18px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.35);
}
.grid{
  display:grid;grid-template-columns:repeat(8,var(--cell));
  grid-auto-rows:var(--cell);
  background:#1a1512;border-radius:3px;overflow:hidden;
}
.c{position:relative;border-right:1px solid rgba(0,0,0,.16);border-bottom:1px solid rgba(0,0,0,.16)}
.c.rice{background:var(--rice);box-shadow:inset 0 0 0 .5px var(--rice-line)}
.c.empty{background:#211A16}
.c.fill{background:#241C17;box-shadow:inset 0 0 0 1px rgba(0,0,0,.22)}
.art{position:absolute;left:11px;top:11px;width:calc(var(--cell) * 8);height:calc(var(--cell) * 8);pointer-events:none;z-index:1}
.art .inner{transform-box:fill-box;transform-origin:center}
.art .inner.just{animation:sink 160ms cubic-bezier(.3,0,.4,1)}
.art .ghostart{opacity:.42}
.c.ghost{outline:2px solid rgba(255,255,255,.85);outline-offset:-2px;z-index:2}
.c.bad{outline:2px solid #D8503A;outline-offset:-2px;z-index:2}

/* 演出：すべて200ms以内 */
.c.just{z-index:3;animation:sink 160ms cubic-bezier(.3,0,.4,1), rim 190ms ease-out}
@keyframes sink{0%{transform:scale(1)}38%{transform:scale(.86)}100%{transform:scale(1)}}
@keyframes rim{0%{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}100%{box-shadow:inset 0 0 0 2px rgba(255,255,255,0)}}
.c.nudge{animation:nudge 160ms ease-out}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}65%{transform:translateX(3px)}}
.c.pulse::before{
  content:"";position:absolute;inset:3px;border-radius:2px;
  background:rgba(243,239,228,.13);animation:breathe 1.6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.85}}

.steam{position:absolute;left:0;right:0;top:-6px;height:70px;pointer-events:none;z-index:6;overflow:hidden}
.steam span{
  position:absolute;bottom:0;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);
  animation:rise 2.4s ease-out forwards;
}
@keyframes rise{
  0%{opacity:0;transform:translate(0,10px) scale(.6)}
  18%{opacity:.9}
  100%{opacity:0;transform:translate(var(--dx,6px),-64px) scale(2.4)}
}
.itadaki{
  position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:24px;letter-spacing:.34em;
  color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6);pointer-events:none;
  animation:said 1500ms ease-out forwards;
}
@keyframes said{0%{opacity:0;transform:scale(.94)}22%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0}}

.sound{
  background:none;border:none;padding:4px 2px;font-size:11px;color:var(--ink-dim);
  letter-spacing:.1em;cursor:pointer;
}
.sound[aria-pressed="true"]{color:var(--wappa)}
.lid{
  position:absolute;inset:0;border-radius:6px;z-index:5;
  background:linear-gradient(150deg,#D8AE77,#9A7040);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.3em;color:#3A2A16;
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s;
}
.lid.off{transform:translateY(-14px) rotate(-1.2deg);opacity:0;pointer-events:none}

/* 手元 */
.hand{margin-top:18px;display:flex;align-items:center;gap:14px}
.now{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.shape{display:grid;gap:2px;flex:none}
.shape i{width:11px;height:11px;border-radius:2px;display:block}
.shape i.o{background:transparent}
.nm{font-size:15px;font-weight:600;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:var(--ink-dim);letter-spacing:.06em;font-variant-numeric:tabular-nums}
button{
  font:inherit;color:var(--ink);background:rgba(243,239,228,.07);
  border:1px solid var(--line);border-radius:8px;padding:11px 14px;
  letter-spacing:.06em;cursor:pointer;transition:background .15s,opacity .15s;
}
button:active{background:rgba(243,239,228,.16)}
button:disabled{opacity:.32;cursor:default}
button:focus-visible{outline:2px solid var(--wappa);outline-offset:2px}
.primary{background:var(--baran);border-color:transparent;font-weight:600}
.queue{display:flex;gap:9px;align-items:flex-end;margin-top:16px;min-height:34px}
.queue .q{display:grid;gap:1.5px;opacity:.5}
.queue .q i{width:7px;height:7px;border-radius:1px;display:block}
.queue .q i.o{background:transparent}
.qlabel{font-size:10px;color:var(--ink-dim);letter-spacing:.14em;margin-right:2px;align-self:center}

.msg{margin-top:14px;font-size:12.5px;color:var(--ink-dim);line-height:1.7;min-height:22px}

/* 結果 */
.result{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.score{display:flex;align-items:baseline;gap:10px}
.score .big{
  font-size:44px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
}
.score .of{font-size:15px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.verdict{font-size:13px;margin-top:4px;letter-spacing:.04em}
.week{display:flex;gap:5px;margin:16px 0 4px}
.week div{
  flex:1;aspect-ratio:1/1.15;border-radius:2px;border:1px solid var(--line);
  display:flex;align-items:flex-end;justify-content:center;font-size:9px;color:var(--ink-dim);
  padding-bottom:2px;
}
.week div.done{border-color:transparent}
.wlabel{font-size:10px;color:var(--ink-dim);letter-spacing:.14em}
.acts{display:flex;gap:9px;margin-top:16px}
.acts button{flex:1}
footer{margin-top:26px;font-size:10.5px;color:#5C6B73;letter-spacing:.08em;text-align:center;line-height:1.9}

/* 絵の見本（?art=1） */
.sheet{display:flex;flex-wrap:wrap;gap:18px 14px;padding:16px 2px}
.sh{display:flex;flex-direction:column;align-items:center;gap:6px}
.sh .pad{background:#241C17;border-radius:3px;padding:0;display:flex}
.sh span{font-size:10.5px;color:var(--ink-dim);letter-spacing:.06em}

/* 調整用（公開前に消す） */
.dev{
  margin-top:14px;padding:12px;border:1px dashed rgba(243,239,228,.18);border-radius:8px;
  display:flex;flex-direction:column;gap:9px;
}
.devrow{display:flex;gap:8px;align-items:center}
.devrow button{flex:1;padding:9px 8px;font-size:12px}
.devwhen{
  flex:1;font-size:11px;color:var(--ink-dim);letter-spacing:.08em;
  font-variant-numeric:tabular-nums;
}
.devrow #wipe{flex:none;font-size:11px;padding:7px 10px}
@media (prefers-reduced-motion:reduce){
  .lid{transition:none}
  .c.just,.c.nudge,.c.pulse::before,.steam span,.itadaki{animation:none}
  .itadaki{opacity:1}
}
</style>

<body>
<div class="wrap">
  <header>
    <h1>弁当詰め</h1>
    <span class="date" id="date"></span>
    <button class="sound" id="snd" aria-pressed="false">音 きり</button>
  </header>
  <div class="badge" id="badge"></div>

  <div class="box" id="box">
    <div class="grid" id="grid"></div>
    <svg class="art" id="riceLayer" viewBox="0 0 8 8" aria-hidden="true"></svg>
    <svg class="art" id="art" viewBox="0 0 8 8" aria-hidden="true"></svg>
    <svg class="art" id="ghostLayer" viewBox="0 0 8 8" aria-hidden="true"></svg>
    <div class="lid" id="lid">ふたを開ける</div>
  </div>

  <div class="sheet" id="sheet" hidden></div>

  <div id="play">
    <div class="hand">
      <div class="now">
        <div class="shape" id="shape"></div>
        <div style="min-width:0">
          <div class="nm" id="name">—</div>
          <div class="sub" id="count"></div>
        </div>
      </div>
      <button id="rot">回す</button>
      <button id="put" class="primary" disabled>置く</button>
    </div>
    <div class="queue" id="queue"></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="result" id="result" hidden>
    <div class="score">
      <span class="big" id="rBig">0</span>
      <span class="of" id="rOf"></span>
    </div>
    <div class="verdict" id="rVerdict"></div>
    <div class="wlabel">こんしゅう</div>
    <div class="week" id="week"></div>
    <div class="acts">
      <button id="copy">結果をコピー</button>
    </div>
    <div class="msg" id="rMsg">あすの弁当は 0時に入れかわります。</div>
  </div>

  <footer>おかずのならびは全員おなじ ／ 1日1回かぎり</footer>

  <div class="dev" id="dev" hidden>
    <div class="devrow">
      <span class="devwhen" id="devWhen"></span>
      <button id="wipe">記録を消す</button>
    </div>
    <div class="devrow">
      <button id="prevDay">前の日</button>
      <button id="again">もう一度</button>
      <button id="nextDay">次の日</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ---------- 保存（localStorage が使えない環境では今回かぎり） ---------- */
const store = (() => {
  let mem = {};
  let ok = false;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); ok = true; } catch (e) {}
  return {
    get(k) { try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch (e) { return mem[k] ?? null; } },
    set(k, v) { try { ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } }
  };
})();

/* ---------- 日付（JST固定） ---------- */
function jstNow() { return new Date(Date.now() + 9 * 3600 * 1000); }
function dayKey(d) {
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
}

/* ---------- 乱数（シード固定） ---------- */
function seedFrom(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- おかず12種 ---------- */
const OKAZU = [
  { id: "goma",   name: "ごま",       color: "#3B322A", cells: [[0,0]] },
  { id: "ume",    name: "梅干し",     color: "#C0303A", cells: [[0,0]] },
  { id: "tamago", name: "卵焼き",     color: "#F0B429", cells: [[0,0],[0,1]] },
  { id: "wiener", name: "ウインナー", color: "#D8503A", cells: [[0,0],[0,1],[0,2]] },
  { id: "hamb",   name: "ハンバーグ", color: "#7A4A2A", cells: [[0,0],[1,0],[1,1]] },
  { id: "chikuwa",name: "ちくわ",     color: "#E4CFA0", cells: [[0,0],[0,1],[1,0],[1,1]] },
  { id: "brocc",  name: "ブロッコリー",color: "#4E7A3A", cells: [[0,0],[0,1],[0,2],[1,1]] },
  { id: "karaage",name: "からあげ",   color: "#B4712A", cells: [[0,1],[0,2],[1,0],[1,1]] },
  { id: "kinpira",name: "きんぴら",   color: "#C8622C", cells: [[0,0],[0,1],[0,2],[0,3]] },
  { id: "potato", name: "ポテト",     color: "#E0AE4C", cells: [[0,0],[1,0],[2,0],[2,1]] },
  { id: "korokke",name: "コロッケ",   color: "#A85C22", cells: [[0,0],[0,1],[1,0],[1,1],[2,0]] },
  { id: "spinach",name: "ほうれん草", color: "#2F5F33", cells: [[0,1],[1,0],[1,1],[1,2],[2,1]] }
];

function norm(cells) {
  const r0 = Math.min(...cells.map(c => c[0])), c0 = Math.min(...cells.map(c => c[1]));
  return cells.map(c => [c[0] - r0, c[1] - c0]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
function rot90(cells) { return norm(cells.map(([r, c]) => [c, -r])); }
function key(cells) { return cells.map(c => c.join(",")).join(" "); }
function variants(cells) {
  const out = [], seen = new Set();
  let cur = norm(cells);
  for (let i = 0; i < 4; i++) {
    const k = key(cur);
    if (!seen.has(k)) { seen.add(k); out.push(cur); }
    cur = rot90(cur);
  }
  return out;
}
const VAR = {};
OKAZU.forEach(o => { VAR[o.id] = variants(o.cells); });

/* ---------- 曜日ごとの設計 ---------- */
const W = 8, H = 8;
// riceCols: ごはんの列数 / set: おかずの傾向 / lockEvery: 何個に1個を回せなくするか(0=なし) / peek: 先読み数
const DAYS = {
  0: { label: "日", riceCols: 3, set: "plain", lockEvery: 4, peek: 3 },
  1: { label: "月", riceCols: 3, set: "plain", lockEvery: 0, peek: 3 },
  2: { label: "火", riceCols: 3, set: "mixed", lockEvery: 0, peek: 3 },
  3: { label: "水", riceCols: 2, set: "mixed", lockEvery: 0, peek: 2 },
  4: { label: "木", riceCols: 2, set: "mixed", lockEvery: 0, peek: 2 },
  5: { label: "金", riceCols: 1, set: "tricky",lockEvery: 0, peek: 2 },
  6: { label: "土", riceCols: 2, set: "mixed", lockEvery: 3, peek: 2 }
};
const SETS = {
  plain:  { tamago: 4, wiener: 3, chikuwa: 4, kinpira: 3, hamb: 3, brocc: 2, potato: 1, korokke: 2, karaage: 1, spinach: 0, goma: 1, ume: 1 },
  mixed:  { tamago: 3, wiener: 3, chikuwa: 3, kinpira: 2, hamb: 3, brocc: 3, potato: 3, korokke: 3, karaage: 2, spinach: 1, goma: 1, ume: 1 },
  tricky: { tamago: 2, wiener: 2, chikuwa: 1, kinpira: 2, hamb: 3, brocc: 3, potato: 4, korokke: 3, karaage: 4, spinach: 3, goma: 1, ume: 1 }
};
const MAX_TINY = 2; // 1マスのおかずは1日2個まで

/* ---------- お題の生成：先に敷き詰めてから並びを崩す ---------- */
function buildDay(dateKey) {
  const d = new Date(dateKey + "T00:00:00Z");
  const cfg = DAYS[d.getUTCDay()];
  const rand = rng(seedFrom(dateKey + "|" + cfg.label));

  const rice = [];
  for (let r = 0; r < H; r++) for (let c = 0; c < cfg.riceCols; c++) rice.push(r * W + c);
  const riceSet = new Set(rice);

  const weights = SETS[cfg.set];
  const pool = [];
  OKAZU.forEach(o => { for (let i = 0; i < (weights[o.id] || 0); i++) pool.push(o.id); });

  const occupied = new Uint8Array(W * H);
  riceSet.forEach(i => occupied[i] = 1);

  const placed = [];
  let tiny = 0;

  function firstEmpty() {
    for (let i = 0; i < W * H; i++) if (!occupied[i]) return i;
    return -1;
  }
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function dfs(depth) {
    const idx = firstEmpty();
    if (idx < 0) return true;
    if (depth > 40) return false;
    const r0 = Math.floor(idx / W), c0 = idx % W;
    const ids = shuffled(pool);
    for (const id of ids) {
      const isTiny = OKAZU.find(o => o.id === id).cells.length === 1;
      if (isTiny && tiny >= MAX_TINY) continue;
      const allowed = VAR[id];
      for (const v of shuffled(allowed)) {
        // v のどのマスを idx に合わせるか（idx は最も左上の空きなので、v の先頭マスを合わせる）
        const anchor = v[0];
        const abs = [];
        let fit = true;
        for (const [dr, dc] of v) {
          const r = r0 + dr - anchor[0], c = c0 + dc - anchor[1];
          if (r < 0 || r >= H || c < 0 || c >= W) { fit = false; break; }
          const i = r * W + c;
          if (occupied[i]) { fit = false; break; }
          abs.push(i);
        }
        if (!fit) continue;
        abs.forEach(i => occupied[i] = 1);
        placed.push({ id, cells: abs, base: key(v) === key(VAR[id][0]) });
        if (isTiny) tiny++;
        if (dfs(depth + 1)) return true;
        abs.forEach(i => occupied[i] = 0);
        placed.pop();
        if (isTiny) tiny--;
      }
    }
    return false;
  }
  const ok = dfs(0);
  if (!ok) return buildDayFallback(dateKey, cfg, riceSet);

  // 並びをシャッフル（置き場所は互いに重ならないので、どの順でも詰め切れる）
  const seq = placed.slice();
  for (let i = seq.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [seq[i], seq[j]] = [seq[j], seq[i]]; }

  // 「回せない」印は、解答で元の向きのまま置かれているおかずにだけ付ける（詰め切れる保証を壊さない）
  const locked = new Set();
  if (cfg.lockEvery > 0) {
    for (let i = cfg.lockEvery - 1; i < seq.length; i += cfg.lockEvery) {
      for (let k = 0; k < cfg.lockEvery; k++) {
        const at = i - k;
        if (at >= 0 && !locked.has(at) && seq[at].base) { locked.add(at); break; }
      }
    }
  }
  return { cfg, rice: riceSet, pieces: seq.map(p => p.id), locked };
}
function buildDayFallback(dateKey, cfg, riceSet) {
  // 万一敷き詰めに失敗したら、卵焼きとごまだけで埋める（起きないはずの保険）
  const free = W * H - riceSet.size;
  const pieces = [];
  for (let i = 0; i < Math.floor(free / 2); i++) pieces.push("tamago");
  if (free % 2) pieces.push("goma");
  return { cfg, rice: riceSet, pieces, locked: new Set() };
}

/* ---------- 音と振動（音は既定できり） ---------- */
let soundOn = store.get("bento.sound") === "1";
let ac = null;
function beep(freq, dur, type, gain) {
  if (!soundOn) return;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "triangle";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(gain || .07, ac.currentTime + .008);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur + .02);
  } catch (e) {}
}
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function effect(idxs, cls) {
  idxs.forEach(i => {
    const el = cells[i];
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    el.addEventListener("animationend", () => el.classList.remove(cls), { once: true });
  });
}
(function initSound() {
  const b = $("snd");
  const sync = () => { b.setAttribute("aria-pressed", soundOn ? "true" : "false"); b.textContent = soundOn ? "音 あり" : "音 きり"; };
  sync();
  b.addEventListener("click", () => {
    soundOn = !soundOn;
    store.set("bento.sound", soundOn ? "1" : "0");
    sync();
    if (soundOn) beep(880, .05, "triangle", .05);
  });
})();

}

/* ---------- ごはん ---------- */
function buildRice(cols, rand) {
  const w = cols, h = H;
  let s = `<rect x=".03" y=".03" width="${w - .06}" height="${h - .06}" rx=".14" fill="#F7F3E8"/>`;
  // 器の奥ばみと手前の陰
  s += `<rect x=".03" y=".03" width="${w - .06}" height=".5" rx=".14" fill="#E6DFCB" opacity=".5"/>`;
  s += `<rect x="${w - .34}" y=".03" width=".31" height="${h - .06}" fill="#DED6C0" opacity=".55"/>`;

  const grains = [];
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    for (let n = 0; n < 6; n++) {
      const x = c + .12 + rand() * .76;
      const y = r + .12 + rand() * .76;
      const a = rand() * 180;
      const long = .1 + rand() * .05;
      const tone = rand();
      grains.push([x, y, a, long, tone]);
    }
  }
  // 影を先に、粒を後に
  grains.forEach(([x, y, a, long]) => {
    s += `<ellipse cx="${(x + .022).toFixed(3)}" cy="${(y + .026).toFixed(3)}" rx="${long.toFixed(3)}" ry="${(long * .48).toFixed(3)}"`
      + ` fill="#CFC6AE" opacity=".5" transform="rotate(${a.toFixed(1)} ${x.toFixed(3)} ${y.toFixed(3)})"/>`;
  });
  grains.forEach(([x, y, a, long, tone]) => {
    const fill = tone > .82 ? "#FFFFFF" : tone > .4 ? "#FCFAF3" : "#F2ECDD";
    s += `<ellipse cx="${x.toFixed(3)}" cy="${y.toFixed(3)}" rx="${long.toFixed(3)}" ry="${(long * .48).toFixed(3)}"`
      + ` fill="${fill}" transform="rotate(${a.toFixed(1)} ${x.toFixed(3)} ${y.toFixed(3)})"/>`;
  });
  // つや
  s += `<ellipse cx="${(w * .38).toFixed(2)}" cy="1.5" rx="${(w * .3).toFixed(2)}" ry="1" fill="#fff" opacity=".18"/>`;
  return s;
}

let clipSeq = 0;
function bbox(cellsArr) {
  return { w: Math.max(...cellsArr.map(c => c[1])) + 1, h: Math.max(...cellsArr.map(c => c[0])) + 1 };
}
function clipShapes(base) {
  const set = new Set(base.map(([r, c]) => r + "," + c));
  let s = "";
  base.forEach(([r, c]) => { s += `<rect x="${c + .03}" y="${r + .03}" width=".94" height=".94" rx=".28"/>`; });
  base.forEach(([r, c]) => {
    if (set.has(r + "," + (c + 1))) s += `<rect x="${c + .4}" y="${r + .03}" width="1.2" height=".94"/>`;
    if (set.has((r + 1) + "," + c)) s += `<rect x="${c + .03}" y="${r + .4}" width=".94" height="1.2"/>`;
  });
  return s;
}
function artGroup(id, k, minR, minC, cls) {
  const base = VAR[id][0], b = bbox(base);
  const rot = ["", `translate(${b.h},0) rotate(90)`, `translate(${b.w},${b.h}) rotate(180)`, `translate(0,${b.w}) rotate(270)`][k % 4];
  const cid = "cp" + (clipSeq++);
  const clip = `<clipPath id="${cid}">${clipShapes(base)}</clipPath>`;
  return `<g transform="translate(${minC},${minR})"><g transform="${rot}">${clip}`
    + `<g class="inner ${cls || ""}" clip-path="url(#${cid})">${ART[id](b.w, b.h)}</g></g></g>`;
}
function artSVG(id, k, px) {
  const cur = VAR[id][k % VAR[id].length], c = bbox(cur);
  return `<svg width="${c.w * px}" height="${c.h * px}" viewBox="0 0 ${c.w} ${c.h}">${DEFS}${artGroup(id, k, 0, 0, "")}</svg>`;
}
function kIndexOf(id, shape) {
  const s = key(shape);
  return Math.max(0, VAR[id].findIndex(v => key(v) === s));
}

function renderHand() {
  if (finished) return;
  const id = day.pieces[cursor], o = okazu(id);
  $("name").textContent = o.name + (curLocked() ? "（回せない）" : "");
  $("count").textContent = (cursor + 1) + " / " + total + "こめ";
  $("shape").innerHTML = artSVG(id, kIndexOf(id, curShape()), 15);
  $("rot").disabled = curLocked() || curVariants().length < 2;
  $("put").disabled = !(ghost && ghost.ok);

  const q = $("queue");
  q.innerHTML = "";
  const lab = document.createElement("span");
  lab.className = "qlabel";
  lab.textContent = "つぎ";
  q.appendChild(lab);
  for (let k = 1; k <= day.cfg.peek && cursor + k < total; k++) {
    const nid = day.pieces[cursor + k];
    const d = document.createElement("div");
    d.className = "q";
    d.innerHTML = artSVG(nid, 0, 10);
    q.appendChild(d);
  }
}

function placementAt(idx, shape) {
  const r0 = Math.floor(idx / W), c0 = idx % W;
  const anchor = shape[0];
  const abs = [];
  for (const [dr, dc] of shape) {
    const r = r0 + dr - anchor[0], c = c0 + dc - anchor[1];
    if (r < 0 || r >= H || c < 0 || c >= W) return null;
    const i = r * W + c;
    if (board[i] !== -1) return null;
    abs.push(i);
  }
  return abs;
}
function anyPlacement() {
  const vs = curVariants();
  for (let i = 0; i < W * H; i++) for (const v of vs) if (placementAt(i, v)) return true;
  return false;
}

function tapCell(idx) {
  if (finished) return;
  const shape = curShape();
  const abs = placementAt(idx, shape);
  if (abs) {
    if (ghost && ghost.ok && ghost.at === idx) { commit(); return; }
    ghost = { cells: abs, ok: true, at: idx };
    $("msg").textContent = "もう一度おすと決まります。";
  } else {
    const r0 = Math.floor(idx / W), c0 = idx % W;
    const anchor = shape[0];
    ghost = { cells: shape.map(([dr, dc]) => (r0 + dr - anchor[0]) * W + (c0 + dc - anchor[1])), ok: false, at: idx };
    $("msg").textContent = "そこには入りません。";
    paint(); renderHand();
    effect(ghost.cells.filter(i => i >= 0 && i < W * H), "nudge");
    beep(150, .07, "sine", .05);
    buzz(12);
    return;
  }
  paint(); renderHand();
}
function commit() {
  const put = ghost.cells.slice();
  const id = day.pieces[cursor];
  placements.push({
    id,
    k: kIndexOf(id, curShape()),
    minR: Math.min(...put.map(i => Math.floor(i / W))),
    minC: Math.min(...put.map(i => i % W))
  });
  justIndex = placements.length - 1;
  put.forEach(i => board[i] = cursor);
  placedCount++;
  cursor++;
  rotIdx = 0;
  ghost = null;
  $("msg").textContent = "";
  const last = cursor >= total;
  const stuck = !last && !anyPlacement();
  paint();
  drawPieces();
  effect(put, "just");
  beep(520 + Math.min(placedCount, 12) * 18, .06, "triangle", .06);
  buzz(8);
  if (last) { finish(true); return; }
  if (stuck) { finish(false); return; }
  renderHand();
}
$("rot").addEventListener("click", () => {
  rotIdx = (rotIdx + 1) % curVariants().length;
  if (ghost) {
    const abs = placementAt(ghost.at, curShape());
    ghost = abs ? { cells: abs, ok: true, at: ghost.at } : null;
  }
  paint(); renderHand();
});
$("put").addEventListener("click", () => { if (ghost && ghost.ok) commit(); });

/* ---------- 結果 ---------- */
function pct() {
  let filled = 0, room = 0;
  for (let i = 0; i < W * H; i++) { if (board[i] === -2) continue; room++; if (board[i] >= 0) filled++; }
  return Math.round(filled / room * 100);
}
function finish(perfect) {
  finished = true;
  ghost = null;
  if (perfect) celebrate();
  const delay = perfect ? 1300 : 420;
  setTimeout(() => {
    $("play").hidden = true;
    $("result").hidden = false;
    $("rBig").textContent = placedCount;
    $("rOf").textContent = "/ " + total + "こ　すきま " + (100 - pct()) + "%";
    $("rVerdict").textContent = perfect
      ? "ぜんぶ入りました。いただきます。"
      : (total - placedCount === 1 ? "あと1こ、入りませんでした。" : "あと" + (total - placedCount) + "こ、入りませんでした。");
    $("rMsg").textContent = practice
      ? (viewKey === today ? "調整用なので記録していません。" : "この日はおためしです。記録は残りません。")
      : "あすの弁当は 0時に入れかわります。";
    renderWeek();
  }, delay);
  saveToday();
  if (!perfect) { beep(190, .18, "sine", .06); buzz(20); }
}
function celebrate() {
  const box = document.querySelector(".box");
  const st = document.createElement("div");
  st.className = "steam";
  for (let i = 0; i < 7; i++) {
    const s = document.createElement("span");
    s.style.left = (10 + i * 12 + Math.random() * 6) + "%";
    s.style.setProperty("--dx", (Math.random() * 16 - 8).toFixed(0) + "px");
    s.style.animationDelay = (i * 120) + "ms";
    st.appendChild(s);
  }
  box.appendChild(st);
  setTimeout(() => st.remove(), 3400);

  const t = document.createElement("div");
  t.className = "itadaki";
  t.textContent = "いただきます";
  box.appendChild(t);
  setTimeout(() => t.remove(), 1600);

  [0, 130, 300].forEach((ms, i) => setTimeout(() => beep([660, 880, 1320][i], .22, "triangle", .05), ms));
  buzz([10, 30, 10]);
}
function saveToday() {
  if (practice || viewKey !== today) return;
  let log = {};
  try { log = JSON.parse(store.get("bento.log") || "{}"); } catch (e) {}
  log[today] = { p: placedCount, t: total, f: pct() };
  store.set("bento.log", JSON.stringify(log));
}
function loadLog() { try { return JSON.parse(store.get("bento.log") || "{}"); } catch (e) { return {}; } }
function weekDays() {
  const n = jstNow();
  const wd = n.getUTCDay();
  const mondayOffset = (wd + 6) % 7;
  const out = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(n.getTime() - (mondayOffset - i) * 86400000);
    out.push(dayKey(d));
  }
  return out;
}
function renderWeek() {
  const log = loadLog(), wk = weekDays(), host = $("week");
  host.innerHTML = "";
  const labels = ["月", "火", "水", "木", "金", "土", "日"];
  wk.forEach((k, i) => {
    const d = document.createElement("div");
    d.textContent = labels[i];
    const rec = log[k];
    if (rec) {
      d.classList.add("done");
      const ratio = rec.p / rec.t;
      d.style.background = ratio === 1 ? "var(--baran)" : `rgba(240,180,41,${0.22 + ratio * 0.6})`;
      d.style.color = "#101820";
    }
    host.appendChild(d);
  });
}
function shareText() {
  const log = loadLog(), wk = weekDays(), labels = ["月", "火", "水", "木", "金", "土", "日"];
  const strip = wk.map(k => {
    const r = log[k];
    if (!r) return "・";
    return r.p === r.t ? "■" : r.p / r.t >= 0.7 ? "▨" : "□";
  }).join("");
  const rec = log[today] || { p: placedCount, t: total, f: pct() };
  const url = playURL();
  return `弁当詰め ${viewKey.slice(5).replace("-", "/")}（${DAYS[new Date(viewKey + "T00:00:00Z").getUTCDay()].label}）
${rec.p}/${rec.t}こ　すきま ${100 - rec.f}%
${strip}` + (url ? "\n" + url : "");
}
$("copy").addEventListener("click", async () => {
  const t = shareText();
  try { await navigator.clipboard.writeText(t); $("rMsg").textContent = "コピーしました。"; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); $("rMsg").textContent = "コピーしました。"; }
    catch (e2) { $("rMsg").textContent = t; }
    ta.remove();
  }
});

/* ---------- URL ---------- */
function param(name) {
  try {
    if (typeof location === "undefined" || !location.search) return null;
    return new URLSearchParams(location.search).get(name);
  } catch (e) { return null; }
}
function playURL() {
  try {
    if (typeof location === "undefined" || location.protocol === "file:") return "";
    return location.origin + location.pathname + "?d=" + viewKey;
  } catch (e) { return ""; }
}

/* ---------- 調整用：好きな日を何度でも ---------- */
function shiftKey(key, delta) {
  const d = new Date(key + "T00:00:00Z");
  return dayKey(new Date(d.getTime() + delta * 86400000));
}
function startDay(key, isPractice) {
  viewKey = key;
  practice = isPractice;
  day = buildDay(key);
  total = day.pieces.length;
  board = new Int8Array(W * H).fill(-1);
  day.rice.forEach(i => board[i] = -2);
  cursor = 0; rotIdx = 0; ghost = null; finished = false; placedCount = 0;
  placements = []; justIndex = -1;
  riceArt = buildRice(day.cfg.riceCols, rng(seedFrom(key + "|rice")));
  $("riceLayer").innerHTML = riceArt;

  if (document.querySelectorAll) {
    document.querySelectorAll(".steam,.itadaki").forEach(el => el.remove());
  }
  const d = new Date(key + "T00:00:00Z");
  $("date").textContent = (d.getUTCMonth() + 1) + "月" + d.getUTCDate() + "日";
  $("badge").innerHTML = `<span>ごはん ${day.cfg.riceCols * H}マス</span><b>${day.locked.size ? day.cfg.lockEvery + "こに1こ 回せない" : "ぜんぶ回せる"}</b><span>おかず ${total}こ</span>`;
  $("play").hidden = false;
  $("result").hidden = true;
  $("msg").textContent = "";
  $("lid").classList.add("off");
  paint(); drawPieces(); renderHand(); renderDev();
}
function renderDev() {
  const d = new Date(viewKey + "T00:00:00Z");
  const lab = DAYS[d.getUTCDay()].label;
  $("devWhen").textContent = viewKey.slice(5).replace("-", "/") + "（" + lab + "）"
    + (viewKey === today ? "" : " ※別の日")
    + (practice ? " 調整用" : "");
}
$("again").addEventListener("click", () => startDay(viewKey, true));
$("prevDay").addEventListener("click", () => startDay(shiftKey(viewKey, -1), true));
$("nextDay").addEventListener("click", () => startDay(shiftKey(viewKey, 1), true));
$("wipe").addEventListener("click", () => {
  store.set("bento.log", "{}");
  $("devWhen").textContent = "記録を消しました";
  renderWeek();
});

/* ---------- 起動 ---------- */
function renderSheet() {
  $("box").hidden = true;
  $("play").hidden = true;
  $("badge").hidden = true;
  const host = $("sheet");
  host.hidden = false;
  host.innerHTML = OKAZU.map(o =>
    `<div class="sh"><div class="pad">${artSVG(o.id, 0, 62)}</div><span>${o.name}</span></div>`
  ).join("");
}
(function boot() {
  if (param("art") === "1") { renderSheet(); return; }
  if (param("dev") === "1") $("dev").hidden = false;

  const asked = param("d");
  const key = (asked && /^\d{4}-\d{2}-\d{2}$/.test(asked)) ? asked : today;
  startDay(key, key !== today);

  const done = key === today ? loadLog()[today] : null;
  if (done) {
    finished = true;
    $("play").hidden = true;
    $("result").hidden = false;
    $("rBig").textContent = done.p;
    $("rOf").textContent = "/ " + done.t + "こ　すきま " + (100 - done.f) + "%";
    $("rVerdict").textContent = "きょうはもう詰めました。";
    $("rMsg").textContent = "あすの弁当は 0時に入れかわります。";
    renderWeek();
    return;
  }
  const lid = $("lid");
  lid.classList.remove("off");
  lid.addEventListener("click", () => lid.classList.add("off"), { once: true });
  setTimeout(() => lid.classList.add("off"), 1100);
})();
</script>
